<!DOCTYPE html>

<style>

  #patriotas-app .mb-1 { margin-bottom: 4px; }
  #patriotas-app .mb-15 { margin-bottom: 6px; }
  #patriotas-app .mb-2 { margin-bottom: 8px; }
  #patriotas-app .mb-3 { margin-bottom: 12px; }
  #patriotas-app .mb-4 { margin-bottom: 16px; }
  #patriotas-app .mb-5 { margin-bottom: 20px; }
  #patriotas-app .mb-6 { margin-bottom: 24px; }
  #patriotas-app .mt-1 { margin-top: 4px; }
  #patriotas-app .mt-2 { margin-top: 8px; }
  #patriotas-app .ml-1 { margin-left: 4px; }
  #patriotas-app .ml-15 { margin-left: 6px; }
  #patriotas-app .ml-auto { margin-left: auto; }

  #patriotas-app .pt-5 { padding-top: 20px; }
  #patriotas-app .pt-8 { padding-top: 32px; }
  #patriotas-app .pb-3 { padding-bottom: 12px; }
  #patriotas-app .pb-4 { padding-bottom: 16px; }
  #patriotas-app .pl-11 { padding-left: 44px; }
  #patriotas-app .border { border: 1px solid rgba(0,0,0,.15); }
  #patriotas-app .border-dashed { border-bottom: 1px dashed rgba(0,0,0,.2); }
  #patriotas-app .capitalize { text-transform: capitalize; }
  #patriotas-app .underline { text-decoration: underline; }
  #patriotas-app .cursor-pointer { cursor: pointer; }
  #patriotas-app .text-right { text-align: right; }
  #patriotas-app .text-center { text-align: center; }
  #patriotas-app .text-left { text-align: left; }
  #patriotas-app .relative { position: relative; }
  #patriotas-app .sticky { position: sticky; top: 0; z-index: 10; }
  #patriotas-app .tracking-tight { letter-spacing: -0.02em; }

  #patriotas-app .chip {
    padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 500;
    border: 1px solid rgba(0,0,0,.2); background: transparent; color: var(--ink);
  }
  #patriotas-app .chip.on { color: #fff; }
  #patriotas-app .btn-primary {
    background: var(--celeste); color: #fff; font-weight: 600; border-radius: 14px;
  }
  #patriotas-app .field {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(0,0,0,.2);
    background: #fff; font-size: 14px;
  }
  #patriotas-app svg { display: block; }
</style>
</head>
<body>

<div id="patriotas-app"></div>

<script>
(function () {
  const root = document.getElementById('patriotas-app');

  /* ---------- fonts ---------- */
  (function loadFonts() {
    const href = "https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap";
    if (!document.querySelector('link[href="' + href + '"]')) {
      const l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = href;
      document.head.appendChild(l);
    }
  })();

  /* ---------- icons (minimal inline svg) ---------- */
  function icon(name, size, extra) {
    size = size || 16;
    extra = extra || '';
    const common = 'width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ' + extra;
    const paths = {
      megaphone: '<path d="M3 11v2a1 1 0 0 0 1 1h2l3.5 5.5a1 1 0 0 0 1.5-1.3L9.5 14H15a9 9 0 0 0 4-1v-8a9 9 0 0 0-4-1H9a6 6 0 0 0-6 6z"/><path d="M15 5v14"/>',
      wallet: '<rect x="2.5" y="6" width="19" height="13" rx="2.5"/><path d="M2.5 10h19"/><circle cx="17" cy="14" r="1.2" fill="currentColor" stroke="none"/>',
      calendar: '<rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8.5 14.5l2 2 4-4.2"/>',
      plus: '<path d="M12 5v14M5 12h14"/>',
      x: '<path d="M6 6l12 12M18 6L6 18"/>',
      chevronLeft: '<path d="M15 18l-6-6 6-6"/>',
      chevronRight: '<path d="M9 18l6-6-6-6"/>',
      arrowRight: '<path d="M5 12h14M13 6l6 6-6 6"/>',
      trash: '<path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0-1 13a1.5 1.5 0 0 1-1.5 1.4h-7A1.5 1.5 0 0 1 6 20L5 7"/>',
      users: '<circle cx="9" cy="8" r="3.2"/><path d="M2.5 19c.7-3.3 3.2-5 6.5-5s5.8 1.7 6.5 5"/><circle cx="17.2" cy="9" r="2.4"/><path d="M15.8 14.2c2.4.4 4 1.8 4.6 4.5"/>',
      star: '<path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/>',
      dollar: '<path d="M12 2v20M17 6.5c-1-1-2.6-1.5-5-1.5-3 0-5 1.3-5 3.5s2 3 5 3.5c3 .5 5 1.3 5 3.5s-2 3.5-5 3.5c-2.4 0-4-.5-5-1.5"/>',
      edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'
    };
    return '<svg ' + common + '>' + (paths[name] || '') + '</svg>';
  }

  function jerseySvg(numero) {
    return (
      '<svg width="64" height="64" viewBox="0 0 80 80" fill="none">' +
        '<path d="M33,5 L25,7 L30,26 L20,30 L18,74 Q40,79 62,74 L60,30 L50,26 L55,7 L47,5 Q40,13 33,5 Z" ' +
          'fill="var(--celeste)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>' +
        '<path d="M34,7 Q40,12 46,7" fill="none" stroke="var(--ink)" stroke-width="2"/>' +
        (numero ? '<text x="40" y="55" text-anchor="middle" font-family="Fraunces, serif" font-weight="700" font-size="24" fill="var(--ink)">' + esc(numero) + '</text>' : '') +
      '</svg>'
    );
  }

  /* ---------- pure helpers ---------- */
  function fmt(n) {
    return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(Math.round(n || 0));
  }
  function monthKey(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }
  function monthLabel(key) {
    const parts = key.split('-').map(Number);
    return new Date(parts[0], parts[1] - 1, 1).toLocaleDateString('es-AR', { month: 'long', year: 'numeric' });
  }
  function pesoDe(eventoId, jugador) {
    const ev = S.eventos.find(function (e) { return e.id === eventoId; });
    const ac = ev && ev.acompanantes && ev.acompanantes[jugador];
    return 1 + (Number(ac) || 0);
  }
  function computeBalances(gastos, participantes, usarPesos) {
    const bal = {};
    participantes.forEach(function (m) { bal[m] = 0; });
    gastos.forEach(function (g) {
      const parts = g.participantes.filter(function (p) { return participantes.indexOf(p) !== -1; });
      if (!parts.length) return;
      const pesos = parts.map(function (p) { return usarPesos ? pesoDe(g.eventoId, p) : 1; });
      const totalPesos = pesos.reduce(function (a, b) { return a + b; }, 0);
      const unidad = g.monto / totalPesos;
      parts.forEach(function (p, i) {
        const cargo = unidad * pesos[i];
        if (p !== g.pagador) {
          bal[p] = (bal[p] || 0) - cargo;
          bal[g.pagador] = (bal[g.pagador] || 0) + cargo;
        }
      });
    });
    return bal;
  }
  function simplifyDebts(balances) {
    const debtors = Object.entries(balances).filter(function (e) { return e[1] < -1; })
      .map(function (e) { return { n: e[0], v: -e[1] }; }).sort(function (a, b) { return b.v - a.v; });
    const creditors = Object.entries(balances).filter(function (e) { return e[1] > 1; })
      .map(function (e) { return { n: e[0], v: e[1] }; }).sort(function (a, b) { return b.v - a.v; });
    const txs = [];
    let i = 0, j = 0;
    while (i < debtors.length && j < creditors.length) {
      const amt = Math.min(debtors[i].v, creditors[j].v);
      txs.push({ from: debtors[i].n, to: creditors[j].n, amt: amt });
      debtors[i].v -= amt; creditors[j].v -= amt;
      if (debtors[i].v < 1) i++;
      if (creditors[j].v < 1) j++;
    }
    return txs;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function aliasTag(name) {
    const alias = S.jugadores[name] && S.jugadores[name].aliasBanco;
    return alias ? ' <span class="text-xs opacity-60">(' + esc(alias) + ')</span>' : '';
  }

  /* ---------- storage ----------
     Datos compartidos del grupo -> API de Google Sheets (Apps Script), una tabla
     con columnas reales por cada tipo de dato.
     Identidad personal ("quién sos vos") -> localStorage de tu navegador. */

  // 1) PEGÁ ACÁ la URL de tu Apps Script (la que termina en /exec)
  const API_URL = 'PEGA_ACA_TU_URL_DE_APPS_SCRIPT';
  // 2) Tiene que ser la MISMA palabra que pusiste en TOKEN dentro de Code.gs
  const API_TOKEN = 'patriotas-2026';

  async function listTable(tableId) {
    try {
      const res = await fetch(API_URL + '?action=list&table=' + encodeURIComponent(tableId) + '&token=' + encodeURIComponent(API_TOKEN));
      const data = await res.json();
      return data.rows || [];
    } catch (e) { console.error('listTable failed', tableId, e); return []; }
  }
  async function upsertRow(tableId, row) {
    try {
      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'upsert', table: tableId, row: row, token: API_TOKEN })
      });
    } catch (e) { console.error('upsertRow failed', tableId, e); }
  }
  async function deleteRow(tableId, key) {
    try {
      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'delete', table: tableId, key: key, token: API_TOKEN })
      });
    } catch (e) { console.error('deleteRow failed', tableId, e); }
  }
  function getPersonal(key, fallback) {
    try {
      const v = localStorage.getItem('patriotas:' + key);
      return v ? JSON.parse(v) : fallback;
    } catch (e) { return fallback; }
  }
  function setPersonal(key, value) {
    try { localStorage.setItem('patriotas:' + key, JSON.stringify(value)); }
    catch (e) { console.error('setPersonal failed', key, e); }
  }

  /* ---------- state ---------- */
  const S = {
    loading: true,
    tab: 'avisos',
    members: [], role: '', yo: '', jugadores: {},
    avisos: [], gastos: [], eventos: [],
    cuotaTipos: {}, cuotaElecciones: {}, cuotaPagos: {}, cuotaExtra: {}, gastosClub: [],
    saldoBanco: 0, adminPin: '1234',
    month: monthKey()
  };
  /* transient ui state, not persisted, survives re-render but not saved */
  const UI = {
    membersOpen: false,
    avisoForm: false,
    gastoEventoId: null,     // which evento is open in Gastos tab
    showCreateEvento: false,
    showGastoForm: false,
    gastoForm: null,         // {pagador, participantes}
    cuotaEditingTipo: null,  // 'entrenamiento' | 'fullPatriota'
    cuotaSubTab: 'estado',   // 'estado' | 'gastosClub'
    showGastoClubForm: false,
    jugadorForm: null,       // null | {editing: identificador|null, nombre, apellido, numero, mail, aliasBanco, telefono}
    bulkForm: false,
    cuotaExtraForm: null,    // null | { member }
    editingSaldoBanco: false,
    loginStep: 'home',       // 'home' | 'jugadorList' | 'adminPin' | 'adminList' | 'adminCreateFirst'
    loginError: '',
    changingPin: false
  };

  async function loadAll() {
    const [jgRows, avRows, evRows, gaRows, ccRows, cuRows, gcRows, cfRows, y] = await Promise.all([
      listTable('jugadores'),
      listTable('avisos'),
      listTable('eventos'),
      listTable('gastos'),
      listTable('cuotaConfig'),
      listTable('cuotas'),
      listTable('gastosClub'),
      listTable('config'),
      getPersonal('yo', '')
    ]);

    // Jugadores -> members / jugadores map (orden = orden de filas)
    S.jugadores = {}; S.members = [];
    jgRows.forEach(function (j) {
      S.jugadores[j.identificador] = j;
      S.members.push(j.identificador);
    });

    // Avisos (más nuevo primero)
    S.avisos = avRows.map(function (r) {
      return { id: Number(r.id), text: r.texto, autor: r.autor, ts: Number(r.id) };
    }).sort(function (a, b) { return b.ts - a.ts; });

    // Eventos
    S.eventos = evRows.map(function (r) {
      let acompanantes = {};
      try { acompanantes = r.acompanantes ? JSON.parse(r.acompanantes) : {}; } catch (e) { acompanantes = {}; }
      return { id: Number(r.id), nombre: r.nombre, fecha: r.fecha, participantes: r.participantes ? String(r.participantes).split('|') : [], acompanantes: acompanantes, ts: Number(r.id) };
    }).sort(function (a, b) { return b.ts - a.ts; });

    // Gastos (de las juntadas)
    S.gastos = gaRows.map(function (r) {
      return {
        id: Number(r.id), eventoId: Number(r.eventoId), desc: r.descripcion, monto: Number(r.monto),
        pagador: r.pagador, participantes: r.participantes ? String(r.participantes).split('|') : [], ts: Number(r.id)
      };
    }).sort(function (a, b) { return b.ts - a.ts; });

    // Precios de cuota por mes
    S.cuotaTipos = {};
    ccRows.forEach(function (r) {
      S.cuotaTipos[r.mes] = { entrenamiento: Number(r.entrenamiento) || 0, fullPatriota: Number(r.fullPatriota) || 0 };
    });

    // Cuotas (una fila por mes+jugador) -> derivar elecciones / pagos / extra
    S.cuotaElecciones = {}; S.cuotaPagos = {}; S.cuotaExtra = {};
    cuRows.forEach(function (r) {
      S.cuotaElecciones[r.mes] = S.cuotaElecciones[r.mes] || {};
      if (r.plan) S.cuotaElecciones[r.mes][r.jugador] = r.plan;
      S.cuotaPagos[r.mes] = S.cuotaPagos[r.mes] || {};
      S.cuotaPagos[r.mes][r.jugador] = r.pago === 'SI';
      S.cuotaExtra[r.mes] = S.cuotaExtra[r.mes] || {};
      S.cuotaExtra[r.mes][r.jugador] = {
        montoCustom: (r.montoPersonalizado !== '' && r.montoPersonalizado !== null && r.montoPersonalizado !== undefined) ? Number(r.montoPersonalizado) : null,
        nota: r.nota || ''
      };
    });

    // Gastos del club
    S.gastosClub = gcRows.map(function (r) {
      return { id: Number(r.id), desc: r.descripcion, monto: Number(r.monto), fecha: r.fecha, cargadoPor: r.cargadoPor, ts: Number(r.id) };
    }).sort(function (a, b) { return b.ts - a.ts; });

    // Config general (saldo de banco, etc)
    S.saldoBanco = 0;
    cfRows.forEach(function (r) {
      if (r.key === 'saldoBanco') S.saldoBanco = Number(r.value) || 0;
      if (r.key === 'adminPin' && r.value) S.adminPin = String(r.value);
    });

    S.yo = y;
    S.role = await getPersonal('role', '');
    S.loading = false;
    render();
  }

  /* ---------- mutations ---------- */
  function esAdminSesion() {
    return S.role === 'admin';
  }
  async function saveAdminPin(pin) {
    S.adminPin = pin;
    await upsertRow('config', { key: 'adminPin', value: pin });
    render();
  }
  async function addGastoClub(g) {
    const row = { id: Date.now(), descripcion: g.desc, monto: g.monto, fecha: g.fecha, cargadoPor: S.yo };
    S.gastosClub = [{ id: row.id, desc: g.desc, monto: g.monto, fecha: g.fecha, cargadoPor: S.yo, ts: row.id }].concat(S.gastosClub);
    await upsertRow('gastosClub', row);
    render();
  }
  async function removeGastoClub(id) {
    S.gastosClub = S.gastosClub.filter(function (g) { return g.id !== id; });
    await deleteRow('gastosClub', [id]);
    render();
  }
  function computeRecaudadoHistorico() {
    let total = 0;
    Object.keys(S.cuotaPagos).forEach(function (mes) {
      const pagosMes = S.cuotaPagos[mes] || {};
      const elecciones = S.cuotaElecciones[mes] || {};
      const tipos = S.cuotaTipos[mes] || { entrenamiento: 0, fullPatriota: 0 };
      const extraMes = S.cuotaExtra[mes] || {};
      Object.keys(pagosMes).forEach(function (member) {
        if (!pagosMes[member]) return;
        const ov = extraMes[member] && extraMes[member].montoCustom;
        const tieneOverride = ov !== null && ov !== undefined && ov !== '';
        if (tieneOverride) { total += Number(ov); return; }
        if (elecciones[member]) {
          total += elecciones[member] === 'fullPatriota' ? tipos.fullPatriota : tipos.entrenamiento;
        }
      });
    });
    return total;
  }
  async function saveSaldoBanco(valor) {
    S.saldoBanco = valor;
    await upsertRow('config', { key: 'saldoBanco', value: valor });
    render();
  }

  function identificadorDe(nombre, apellido) {
    nombre = (nombre || '').trim();
    apellido = (apellido || '').trim();
    return apellido ? nombre + ' ' + apellido : nombre;
  }
  async function addJugador(perfil) {
    const identificador = identificadorDe(perfil.nombre, perfil.apellido);
    if (!identificador || S.jugadores[identificador]) return;
    const row = Object.assign({ identificador: identificador }, perfil);
    S.jugadores = Object.assign({}, S.jugadores);
    S.jugadores[identificador] = row;
    S.members = S.members.concat([identificador]);
    await upsertRow('jugadores', row);
  }
  async function updateJugador(identificador, patch) {
    if (!S.jugadores[identificador]) return;
    S.jugadores = Object.assign({}, S.jugadores);
    S.jugadores[identificador] = Object.assign({}, S.jugadores[identificador], patch);
    await upsertRow('jugadores', S.jugadores[identificador]);
  }
  async function removeMember(name) {
    S.members = S.members.filter(function (m) { return m !== name; });
    const wasJugador = !!S.jugadores[name];
    S.jugadores = Object.assign({}, S.jugadores);
    delete S.jugadores[name];
    if (wasJugador) await deleteRow('jugadores', [name]);
  }
  async function chooseYo(name, role) {
    S.yo = name;
    S.role = role;
    await setPersonal('yo', name);
    await setPersonal('role', role);
    render();
  }
  async function cambiarYo() {
    S.yo = '';
    S.role = '';
    UI.loginStep = 'home';
    UI.loginError = '';
    await setPersonal('yo', '');
    await setPersonal('role', '');
    render();
  }
  async function addAviso(text) {
    text = (text || '').trim();
    if (!text) return;
    const id = Date.now();
    S.avisos = [{ id: id, text: text, autor: S.yo, ts: id }].concat(S.avisos);
    await upsertRow('avisos', { id: id, texto: text, autor: S.yo, fecha: new Date(id).toISOString() });
    render();
  }
  async function removeAviso(id) {
    S.avisos = S.avisos.filter(function (a) { return a.id !== id; });
    await deleteRow('avisos', [id]);
    render();
  }
  async function addEvento(e) {
    if (!e.nombre.trim() || !e.participantes.length) return;
    const id = Date.now();
    const acompanantes = e.acompanantes || {};
    S.eventos = [{ id: id, nombre: e.nombre, fecha: e.fecha, participantes: e.participantes, acompanantes: acompanantes, ts: id }].concat(S.eventos);
    await upsertRow('eventos', { id: id, nombre: e.nombre, fecha: e.fecha, participantes: e.participantes.join('|'), acompanantes: JSON.stringify(acompanantes) });
    render();
  }
  async function setAcompanantes(eventoId, jugador, cantidad) {
    const evento = S.eventos.find(function (e) { return e.id === eventoId; });
    if (!evento) return;
    evento.acompanantes = Object.assign({}, evento.acompanantes || {});
    if (cantidad > 0) evento.acompanantes[jugador] = cantidad;
    else delete evento.acompanantes[jugador];
    await upsertRow('eventos', { id: evento.id, nombre: evento.nombre, fecha: evento.fecha, participantes: evento.participantes.join('|'), acompanantes: JSON.stringify(evento.acompanantes) });
    render();
  }
  async function removeEvento(id) {
    S.eventos = S.eventos.filter(function (e) { return e.id !== id; });
    await deleteRow('eventos', [id]);
    const idsGastos = S.gastos.filter(function (g) { return g.eventoId === id; }).map(function (g) { return g.id; });
    S.gastos = S.gastos.filter(function (g) { return g.eventoId !== id; });
    for (const gid of idsGastos) { await deleteRow('gastos', [gid]); }
    render();
  }
  async function addGasto(g) {
    const id = Date.now();
    S.gastos = [{ id: id, eventoId: g.eventoId, desc: g.desc, monto: g.monto, pagador: g.pagador, participantes: g.participantes, ts: id }].concat(S.gastos);
    await upsertRow('gastos', { id: id, eventoId: g.eventoId, descripcion: g.desc, monto: g.monto, pagador: g.pagador, participantes: g.participantes.join('|'), fecha: new Date(id).toISOString() });
    render();
  }
  async function removeGasto(id) {
    S.gastos = S.gastos.filter(function (g) { return g.id !== id; });
    await deleteRow('gastos', [id]);
    render();
  }
  async function saveCuotaTipo(mes, tipo, valor) {
    S.cuotaTipos = Object.assign({}, S.cuotaTipos);
    S.cuotaTipos[mes] = Object.assign({ entrenamiento: 0, fullPatriota: 0 }, S.cuotaTipos[mes] || {});
    S.cuotaTipos[mes][tipo] = valor;
    await upsertRow('cuotaConfig', { mes: mes, entrenamiento: S.cuotaTipos[mes].entrenamiento, fullPatriota: S.cuotaTipos[mes].fullPatriota });
    render();
  }
  async function syncCuotaRow(mes, miembro) {
    const plan = (S.cuotaElecciones[mes] && S.cuotaElecciones[mes][miembro]) || '';
    const pago = (S.cuotaPagos[mes] && S.cuotaPagos[mes][miembro]) ? 'SI' : '';
    const extra = (S.cuotaExtra[mes] && S.cuotaExtra[mes][miembro]) || {};
    await upsertRow('cuotas', {
      mes: mes, jugador: miembro, plan: plan, pago: pago,
      montoPersonalizado: (extra.montoCustom !== null && extra.montoCustom !== undefined) ? extra.montoCustom : '',
      nota: extra.nota || ''
    });
  }
  async function elegirCuota(mes, miembro, tipo) {
    S.cuotaElecciones = Object.assign({}, S.cuotaElecciones);
    S.cuotaElecciones[mes] = Object.assign({}, S.cuotaElecciones[mes] || {});
    S.cuotaElecciones[mes][miembro] = tipo;
    await syncCuotaRow(mes, miembro);
    render();
  }
  async function togglePago(mes, miembro) {
    S.cuotaPagos = Object.assign({}, S.cuotaPagos);
    S.cuotaPagos[mes] = Object.assign({}, S.cuotaPagos[mes] || {});
    S.cuotaPagos[mes][miembro] = !S.cuotaPagos[mes][miembro];
    await syncCuotaRow(mes, miembro);
    render();
  }
  async function saveCuotaExtra(mes, miembro, patch) {
    S.cuotaExtra = Object.assign({}, S.cuotaExtra);
    S.cuotaExtra[mes] = Object.assign({}, S.cuotaExtra[mes] || {});
    S.cuotaExtra[mes][miembro] = Object.assign({ montoCustom: null, nota: '' }, S.cuotaExtra[mes][miembro] || {}, patch);
    await syncCuotaRow(mes, miembro);
    UI.cuotaExtraForm = null;
    render();
  }

  function bindOnboarding() {
    const goJugador = document.getElementById('btn-go-jugador');
    if (goJugador) goJugador.addEventListener('click', function () { UI.loginStep = 'jugadorList'; render(); });

    const goAdmin = document.getElementById('btn-go-admin');

    const nameBack = document.getElementById('btn-name-back');
    if (nameBack) nameBack.addEventListener('click', function () { UI.loginStep = 'home'; render(); });

    root.querySelectorAll('[data-choose-name]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const name = btn.getAttribute('data-choose-name');
        const role = UI.loginStep === 'adminList' ? 'admin' : 'jugador';
        chooseYo(name, role);
      });
    });

    const pinBack = document.getElementById('btn-pin-back');
    if (pinBack) pinBack.addEventListener('click', function () { UI.loginStep = 'home'; UI.loginError = ''; render(); });

    const pinEnter = document.getElementById('btn-pin-enter');
    if (pinEnter) pinEnter.addEventListener('click', function () {
      const pin = document.getElementById('pin-input').value.trim();

        UI.loginError = 'PIN incorrecto.';

        return;

      UI.loginStep = S.members.length === 0 ? 'adminCreateFirst' : 'adminList';

    const txHtml = transacciones.length ? (

        '<p class="text-xs font-semibold opacity-50 mb-2" style="text-transform:uppercase;letter-spacing:.03em">Quién le paga a quién</p>' +
        '<div class="space-y-15">' +
          transacciones.map(function (t) {
            return (
              '<div class="flex items-center gap-2 text-sm px-3 py-2 rounded-lg" style="background:var(--card)">' +
                '<span class="font-medium">' + esc(t.from) + '</span>' + icon('arrowRight', 13, 'style="opacity:.4"') +
                '<span class="font-medium">' + esc(t.to) + aliasTag(t.to) + '</span>' +

    const acompHtml = evento.participantes.length ? (
      '<div class="mb-4">' +
        '<p class="text-xs font-semibold opacity-50 mb-2" style="text-transform:uppercase;letter-spacing:.03em">Acompañantes</p>' +
        '<div class="space-y-15">' +

                  '<button data-acomp-evento-minus="' + esc(p) + '" class="opacity-60" style="width:22px">−</button>' +

      '<div class="rounded-xl border p-3 mb-5 space-y-25">' +

        '<input id="gasto-monto" type="number" class="field mono" placeholder="Monto total">' +

  function bindGastos() {
    const backBtn = document.getElementById('btn-back-eventos');
    if (backBtn) backBtn.addEventListener('click', function () { UI.gastoEventoId = null; UI.showGastoForm = false; UI.gastoForm = null; render(); });

    const showCreate = document.getElementById('btn-show-create-evento');
    if (showCreate) showCreate.addEventListener('click', function () { UI.showCreateEvento = true; render(); });

    const cancelEvento = document.getElementById('btn-cancel-evento');
    if (cancelEvento) cancelEvento.addEventListener('click', function () { UI.showCreateEvento = false; render(); });

    const chipsWrap = document.getElementById('evento-chips');
    let eventoParticipantes = S.members.slice();
    let eventoAcompanantes = {};
    if (chipsWrap) {
      chipsWrap.querySelectorAll('[data-evento-chip]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const name = btn.getAttribute('data-evento-chip');
          const idx = eventoParticipantes.indexOf(name);
          const wrap = chipsWrap.querySelector('[data-acomp-wrap="' + CSS.escape(name) + '"]');
          if (idx !== -1) {
            eventoParticipantes.splice(idx, 1); btn.classList.remove('on');
            btn.style.background = 'transparent'; btn.style.borderColor = 'rgba(0,0,0,.2)'; btn.style.color = 'var(--ink)';
            if (wrap) wrap.style.visibility = 'hidden';
          } else {
            eventoParticipantes.push(name); btn.classList.add('on');
            btn.style.background = 'var(--pos)'; btn.style.borderColor = 'var(--pos)'; btn.style.color = '#fff';
            if (wrap) wrap.style.visibility = 'visible';
          }
        });
      });
      chipsWrap.querySelectorAll('[data-acomp-plus]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const name = btn.getAttribute('data-acomp-plus');
          eventoAcompanantes[name] = (eventoAcompanantes[name] || 0) + 1;
          chipsWrap.querySelector('[data-acomp-count="' + CSS.escape(name) + '"]').textContent = eventoAcompanantes[name];
        });
      });
      chipsWrap.querySelectorAll('[data-acomp-minus]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const name = btn.getAttribute('data-acomp-minus');
          eventoAcompanantes[name] = Math.max(0, (eventoAcompanantes[name] || 0) - 1);
          chipsWrap.querySelector('[data-acomp-count="' + CSS.escape(name) + '"]').textContent = eventoAcompanantes[name];
        });
      });
    }
    const createBtn = document.getElementById('btn-create-evento');
    if (createBtn) createBtn.addEventListener('click', function () {
      const nombre = document.getElementById('evento-nombre').value.trim();
      const fecha = document.getElementById('evento-fecha').value;
      if (!nombre || !eventoParticipantes.length) return;
      UI.showCreateEvento = false;
      const acompanantes = {};
      eventoParticipantes.forEach(function (p) { if (eventoAcompanantes[p]) acompanantes[p] = eventoAcompanantes[p]; });
      addEvento({ nombre: nombre, fecha: fecha, participantes: eventoParticipantes, acompanantes: acompanantes });
    });

    root.querySelectorAll('[data-open-evento]').forEach(function (btn) {
      btn.addEventListener('click', function () { UI.gastoEventoId = Number(btn.getAttribute('data-open-evento')); UI.showGastoForm = false; UI.gastoForm = null; render(); });
    });

    const removeEventoBtn = document.getElementById('btn-remove-evento');
    if (removeEventoBtn) removeEventoBtn.addEventListener('click', function () {
      const id = UI.gastoEventoId;
      UI.gastoEventoId = null;
      removeEvento(id);
    });

    root.querySelectorAll('[data-acomp-evento-plus]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const p = btn.getAttribute('data-acomp-evento-plus');
        const evento = S.eventos.find(function (e) { return e.id === UI.gastoEventoId; });
        const actual = (evento && evento.acompanantes && evento.acompanantes[p]) || 0;
        setAcompanantes(UI.gastoEventoId, p, actual + 1);
      });
    });
    root.querySelectorAll('[data-acomp-evento-minus]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const p = btn.getAttribute('data-acomp-evento-minus');
        const evento = S.eventos.find(function (e) { return e.id === UI.gastoEventoId; });
        const actual = (evento && evento.acompanantes && evento.acompanantes[p]) || 0;
        setAcompanantes(UI.gastoEventoId, p, Math.max(0, actual - 1));
      });
    });

    const showGastoForm = document.getElementById('btn-show-gasto-form');
    if (showGastoForm) showGastoForm.addEventListener('click', function () { UI.showGastoForm = true; UI.gastoForm = null; render(); });

    const cancelGasto = document.getElementById('btn-cancel-gasto');
    if (cancelGasto) cancelGasto.addEventListener('click', function () { UI.showGastoForm = false; UI.gastoForm = null; render(); });

    root.querySelectorAll('[data-pagador-chip]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        UI.gastoForm.pagador = btn.getAttribute('data-pagador-chip');
        document.querySelectorAll('#pagador-chips [data-pagador-chip]').forEach(function (b) {
          const on = b.getAttribute('data-pagador-chip') === UI.gastoForm.pagador;
          b.classList.toggle('on', on);
          b.style.background = on ? 'var(--ink)' : 'transparent';
          b.style.borderColor = on ? 'var(--ink)' : 'rgba(0,0,0,.2)';
          b.style.color = on ? '#fff' : 'var(--ink)';
        });
      });
    });
    root.querySelectorAll('[data-part-chip]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const name = btn.getAttribute('data-part-chip');
        const arr = UI.gastoForm.participantes;
        const idx = arr.indexOf(name);
        if (idx !== -1) { arr.splice(idx, 1); btn.classList.remove('on'); btn.style.background = 'transparent'; btn.style.borderColor = 'rgba(0,0,0,.2)'; btn.style.color = 'var(--ink)'; }
        else { arr.push(name); btn.classList.add('on'); btn.style.background = 'var(--pos)'; btn.style.borderColor = 'var(--pos)'; btn.style.color = '#fff'; }
      });
    });
    const saveGasto = document.getElementById('btn-save-gasto');
    if (saveGasto) saveGasto.addEventListener('click', function () {
      const desc = document.getElementById('gasto-desc').value.trim();
      const monto = parseFloat(document.getElementById('gasto-monto').value);
      const gf = UI.gastoForm;
      if (!desc || !monto || !gf.pagador || !gf.participantes.length) return;
      const eventoId = UI.gastoEventoId;
      UI.showGastoForm = false;
      UI.gastoForm = null;
      addGasto({ desc: desc, monto: monto, pagador: gf.pagador, participantes: gf.participantes, eventoId: eventoId });
    });

    root.querySelectorAll('[data-remove-gasto]').forEach(function (btn) {
      btn.addEventListener('click', function () { removeGasto(Number(btn.getAttribute('data-remove-gasto'))); });
    });
  }

  /* ---------- cuotas ---------- */
  function renderCuotas() {
    if (!esAdminSesion()) return renderCuotaJugadorPropio();

    const recaudadoHistorico = computeRecaudadoHistorico();
    const gastosClubTotal = S.gastosClub.reduce(function (s, g) { return s + g.monto; }, 0);

        '<div class="flex items-center justify-between">' +

          (!UI.editingSaldoBanco ? '<button id="btn-edit-saldo" class="opacity-60">' + icon('edit', 15) + '</button>' : '') +
        '</div>' +

  function renderCuotaJugadorPropio() {
    const tipos = S.cuotaTipos[S.month] || { entrenamiento: 0, fullPatriota: 0 };
    const elecciones = S.cuotaElecciones[S.month] || {};
    const pagosMes = S.cuotaPagos[S.month] || {};
    const extraMes = S.cuotaExtra[S.month] || {};
    const m = S.yo;
    const tipo = elecciones[m];
    const nota = extraMes[m] && extraMes[m].nota;
    const ov = extraMes[m] && extraMes[m].montoCustom;
    const tieneOverride = ov !== null && ov !== undefined && ov !== '';
    const monto = tieneOverride ? Number(ov) : (tipo === 'fullPatriota' ? tipos.fullPatriota : tipos.entrenamiento);
    const paid = !!pagosMes[m];
    const tieneAlgo = tieneOverride || !!tipo;

    return (
      '<div class="pb-4">' +
        '<div class="flex items-center justify-between mb-4">' +
          '<button id="btn-month-prev" class="opacity-60" style="padding:6px">' + icon('chevronLeft', 18) + '</button>' +
          '<span class="text-sm font-semibold capitalize">' + monthLabel(S.month) + '</span>' +
          '<button id="btn-month-next" class="opacity-60" style="padding:6px">' + icon('chevronRight', 18) + '</button>' +
        '</div>' +
        '<div class="rounded-xl p-5" style="background:var(--card)">' +
          (tieneAlgo ? (
            '<p class="text-xs opacity-60 mb-1">tu plan este mes</p>' +
            '<p class="text-lg font-semibold mb-2">' + (tipo ? (tipo === 'fullPatriota' ? 'Full Patriota' : 'Entrenamiento') : 'Sin plan asignado') + '</p>' +
            '<p class="mono text-3xl font-semibold mb-3">' + fmt(monto) + '</p>' +
            '<span class="text-xs font-semibold px-3 py-1 rounded-full" style="background:' + (paid ? 'var(--pos)' : 'var(--neg)') + ';color:#fff">' + (paid ? 'pagado' : 'pendiente') + '</span>' +
            (nota ? '<p class="text-sm font-medium mt-3" style="color:var(--pos)">' + esc(nota) + '</p>' : '')
          ) : '<p class="text-sm opacity-55">Todavía no tenés un plan de cuota asignado para este mes. Hablalo con el Admin.</p>') +
        '</div>' +
      '</div>'
    );
  }

  function bindCuotaJugadorPropio() {
    document.getElementById('btn-month-prev').addEventListener('click', function () { shiftMonth(-1); });
    document.getElementById('btn-month-next').addEventListener('click', function () { shiftMonth(1); });
  }

  function renderCuotaEstado() {
    const tipos = S.cuotaTipos[S.month] || { entrenamiento: 0, fullPatriota: 0 };
    const elecciones = S.cuotaElecciones[S.month] || {};
    const pagosMes = S.cuotaPagos[S.month] || {};
    const extraMes = S.cuotaExtra[S.month] || {};
    function tieneOverride(m) {
      const ov = extraMes[m] && extraMes[m].montoCustom;
      return ov !== null && ov !== undefined && ov !== '';
    }
    function montoDe(m) {
      if (tieneOverride(m)) return Number(extraMes[m].montoCustom);
      return elecciones[m] === 'fullPatriota' ? tipos.fullPatriota : tipos.entrenamiento;
    }
    function tieneMontoDefinido(m) { return tieneOverride(m) || !!elecciones[m]; }
    const total = S.members.reduce(function (s, m) { return s + (tieneMontoDefinido(m) ? montoDe(m) : 0); }, 0);
    const recaudado = S.members.reduce(function (s, m) { return s + (pagosMes[m] && tieneMontoDefinido(m) ? montoDe(m) : 0); }, 0);

    const membersHtml = S.members.length ? S.members.map(function (m) {
      const paid = !!pagosMes[m];
      const tipo = elecciones[m];
      const nota = extraMes[m] && extraMes[m].nota;
      const pagoBadge = '<button data-toggle-pago="' + esc(m) + '" class="text-xs font-semibold px-2 rounded-full" style="padding:2px 8px;background:' + (paid ? 'var(--pos)' : 'var(--neg)') + ';color:#fff">' + (paid ? 'pagó' : 'debe') + '</button>';
      const planSection = '<div class="flex gap-15">' + ['entrenamiento', 'fullPatriota'].map(function (t) {
        const on = tipo === t;
        const label = t === 'entrenamiento' ? 'Entrenamiento' : 'Full Patriota';
        const val = t === 'entrenamiento' ? tipos.entrenamiento : tipos.fullPatriota;
        return '<button data-elegir="' + t + '" data-elegir-member="' + esc(m) + '" class="flex-1 text-xs font-medium py-15 rounded-lg border" style="' + (on ? 'border-color:var(--celeste);background:var(--celeste);color:#fff' : 'color:var(--ink)') + '">' + label + ' · ' + fmt(val) + '</button>';
      }).join('') + '</div>';
      const overrideTag = tieneOverride(m) ? '<p class="text-xs mt-1" style="color:var(--celeste)">monto personalizado: ' + fmt(extraMes[m].montoCustom) + '</p>' : '';
      const notaTag = nota ? '<p class="text-xs font-medium mt-1" style="color:var(--pos)">' + esc(nota) + '</p>' : '';
      const editBtn = '<button data-edit-extra="' + esc(m) + '" class="opacity-50" title="monto personalizado / nota">' + icon('edit', 12) + '</button>';
      const extraForm = (UI.cuotaExtraForm && UI.cuotaExtraForm.member === m) ? renderCuotaExtraForm(m, extraMes[m]) : '';
      return (
        '<div class="px-3 py-25 rounded-xl border" data-member-row="' + esc(m) + '" style="border-color:' + (paid ? 'var(--pos)' : 'rgba(0,0,0,.15)') + ';background:' + (paid ? 'rgba(62,142,89,.06)' : 'transparent') + '">' +
          '<div class="flex items-center justify-between mb-15">' +
            '<span class="text-sm font-medium">' + esc(m) + '</span>' +
            '<span class="flex items-center gap-15">' + editBtn + pagoBadge + '</span>' +
          '</div>' +
          planSection + overrideTag + notaTag + extraForm +
        '</div>'
      );
    }).join('<div style="height:6px"></div>') : '<p class="text-sm opacity-45 text-center" style="padding:32px 0">Sumá jugadores desde el panel de abajo para armar la lista de la cuota.</p>';

    return (
      '<div>' +
        '<div class="flex items-center justify-between mb-4">' +
          '<button id="btn-month-prev" class="opacity-60" style="padding:6px">' + icon('chevronLeft', 18) + '</button>' +
          '<span class="text-sm font-semibold capitalize">' + monthLabel(S.month) + '</span>' +
          '<button id="btn-month-next" class="opacity-60" style="padding:6px">' + icon('chevronRight', 18) + '</button>' +
        '</div>' +
        '<div class="rounded-xl p-4 mb-3" style="background:var(--card)">' +
          '<p class="text-xs opacity-60 mb-2">planes de este mes</p>' +
          renderTipoRow('Entrenamiento', 'entrenamiento', tipos.entrenamiento) +
          '<div style="height:8px"></div>' +
          renderTipoRow('Full Patriota', 'fullPatriota', tipos.fullPatriota) +
        '</div>' +
        '<div class="rounded-xl p-4 mb-5" style="background:var(--card)">' +
          '<div class="flex items-center justify-between">' +
            '<div><p class="text-xs opacity-60">recaudado del mes</p><p class="mono text-xl font-semibold">' + fmt(recaudado) + '</p></div>' +
            '<div class="text-right"><p class="text-xs opacity-60">esperado del mes</p><p class="mono text-xl font-semibold">' + fmt(total) + '</p></div>' +
          '</div>' +
        '</div>' +
        membersHtml +
      '</div>'
    );
  }

  function renderCuotaGastosClub() {
    const form = (
      '<div class="rounded-xl border p-3 mb-4 space-y-25">' +
        '<input id="gc-desc" class="field" placeholder="¿En qué se gastó? (ej: cancha, pelotas, árbitro)">' +
        '<div class="flex gap-2">' +
          '<input id="gc-monto" type="number" class="field mono" placeholder="Monto" style="flex:1">' +
          '<input id="gc-fecha" type="date" class="field" style="flex:1" value="' + new Date().toISOString().slice(0, 10) + '">' +
        '</div>' +
        '<button id="btn-add-gasto-club" class="w-full py-2 rounded-lg text-sm font-semibold" style="background:var(--ink);color:#fff">Registrar gasto</button>' +
      '</div>'
    );

    const list = S.gastosClub.length ? S.gastosClub.map(function (g) {
      return (
        '<div class="flex items-center gap-3 p-3 rounded-xl relative border-dashed">' +
          '<div class="flex-1">' +
            '<p class="text-sm font-medium">' + esc(g.desc) + '</p>' +
            '<p class="text-xs opacity-55">' + new Date(g.fecha).toLocaleDateString('es-AR', { day: 'numeric', month: 'short' }) + ' · cargó ' + esc(g.cargadoPor) + '</p>' +
          '</div>' +
          '<span class="mono text-sm font-semibold">' + fmt(g.monto) + '</span>' +
          '<button data-remove-gasto-club="' + g.id + '" class="opacity-30">' + icon('trash', 14) + '</button>' +
        '</div>'
      );
    }).join('') : '<p class="text-sm opacity-45 text-center" style="padding:32px 0">Todavía no se cargó ningún gasto del club.</p>';

    return '<div>' + form + '<div class="space-y-2">' + list + '</div></div>';
  }

  function renderCuotaExtraForm(member, extra) {
    const montoActual = extra && extra.montoCustom !== null && extra.montoCustom !== undefined ? extra.montoCustom : '';
    const notaActual = (extra && extra.nota) || '';
    return (
      '<div class="rounded-lg border p-3 mt-2 space-y-15" style="background:#fff">' +
        '<input id="ce-monto" type="number" class="field mono" placeholder="Monto personalizado (vacío = precio del plan)" value="' + esc(montoActual) + '">' +
        '<input id="ce-nota" class="field" placeholder="Nota (ej: en recuperación, cargo extra)" value="' + esc(notaActual) + '">' +
        '<div class="flex gap-2">' +
          '<button data-cancel-extra class="flex-1 py-15 rounded-lg text-xs border">Cancelar</button>' +
          '<button data-save-extra="' + esc(member) + '" class="flex-1 py-15 rounded-lg text-xs font-semibold" style="background:var(--celeste);color:#fff">Guardar</button>' +
        '</div>' +
      '</div>'
    );
  }

  function renderTipoRow(label, tipoKey, valor) {
    const editing = UI.cuotaEditingTipo === tipoKey;
    return (
      '<div class="flex items-center justify-between" data-tipo-row="' + tipoKey + '">' +
        '<span class="text-sm font-medium">' + label + '</span>' +
        (editing
          ? '<div class="flex items-center gap-2"><input id="tipo-draft-' + tipoKey + '" type="number" class="mono" style="width:96px;padding:4px 8px;border-radius:8px;border:1px solid rgba(0,0,0,.2)" value="' + valor + '"><button data-save-tipo="' + tipoKey + '" class="text-xs font-semibold" style="background:var(--celeste);color:#fff;padding:4px 8px;border-radius:8px">Ok</button></div>'
          : '<p data-edit-tipo="' + tipoKey + '" class="mono text-sm font-semibold cursor-pointer">' + fmt(valor) + '</p>'
        ) +
      '</div>'
    );
  }

  function bindCuotas() {
    root.querySelectorAll('[data-cuota-subtab]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        UI.cuotaSubTab = btn.getAttribute('data-cuota-subtab');
        UI.cuotaEditingTipo = null;
        UI.cuotaExtraForm = null;
        render();
      });
    });

    const editSaldoBtn = document.getElementById('btn-edit-saldo');
    if (editSaldoBtn) editSaldoBtn.addEventListener('click', function () { UI.editingSaldoBanco = true; render(); });
    const saveSaldoBtn = document.getElementById('btn-save-saldo');
    if (saveSaldoBtn) saveSaldoBtn.addEventListener('click', function () {
      const val = parseFloat(document.getElementById('saldo-draft').value) || 0;
      UI.editingSaldoBanco = false;
      saveSaldoBanco(val);
    });

    if (UI.cuotaSubTab === 'estado') {
      document.getElementById('btn-month-prev').addEventListener('click', function () { shiftMonth(-1); });
      document.getElementById('btn-month-next').addEventListener('click', function () { shiftMonth(1); });

      ['entrenamiento', 'fullPatriota'].forEach(function (tipoKey) {
        const editBtn = root.querySelector('[data-edit-tipo="' + tipoKey + '"]');
        if (editBtn) editBtn.addEventListener('click', function () { UI.cuotaEditingTipo = tipoKey; render(); });
        const saveBtn = root.querySelector('[data-save-tipo="' + tipoKey + '"]');
        if (saveBtn) saveBtn.addEventListener('click', function () {
          const val = parseFloat(document.getElementById('tipo-draft-' + tipoKey).value) || 0;
          UI.cuotaEditingTipo = null;
          saveCuotaTipo(S.month, tipoKey, val);
        });
      });

      root.querySelectorAll('[data-toggle-pago]').forEach(function (btn) {
        btn.addEventListener('click', function () { togglePago(S.month, btn.getAttribute('data-toggle-pago')); });
      });
      root.querySelectorAll('[data-member-row]').forEach(function (rowEl) {
        const member = rowEl.getAttribute('data-member-row');
        rowEl.querySelectorAll('[data-elegir]').forEach(function (btn) {
          btn.addEventListener('click', function () { elegirCuota(S.month, member, btn.getAttribute('data-elegir')); });
        });
      });
      root.querySelectorAll('[data-edit-extra]').forEach(function (btn) {
        btn.addEventListener('click', function () { UI.cuotaExtraForm = { member: btn.getAttribute('data-edit-extra') }; render(); });
      });
      const cancelExtra = root.querySelector('[data-cancel-extra]');
      if (cancelExtra) cancelExtra.addEventListener('click', function () { UI.cuotaExtraForm = null; render(); });
      const saveExtraBtn = root.querySelector('[data-save-extra]');
      if (saveExtraBtn) saveExtraBtn.addEventListener('click', function () {
        const member = saveExtraBtn.getAttribute('data-save-extra');
        const montoStr = document.getElementById('ce-monto').value.trim();
        const nota = document.getElementById('ce-nota').value.trim();
        const montoCustom = montoStr === '' ? null : parseFloat(montoStr);
        saveCuotaExtra(S.month, member, { montoCustom: montoCustom, nota: nota });
      });
    } else {
      const addBtn = document.getElementById('btn-add-gasto-club');
      if (addBtn) addBtn.addEventListener('click', function () {
        const desc = document.getElementById('gc-desc').value.trim();
        const monto = parseFloat(document.getElementById('gc-monto').value);
        const fecha = document.getElementById('gc-fecha').value;
        if (!desc || !monto) return;
        addGastoClub({ desc: desc, monto: monto, fecha: fecha });
      });
      root.querySelectorAll('[data-remove-gasto-club]').forEach(function (btn) {
        btn.addEventListener('click', function () { removeGastoClub(Number(btn.getAttribute('data-remove-gasto-club'))); });
      });
    }
  }
  function shiftMonth(delta) {
    const parts = S.month.split('-').map(Number);
    const d = new Date(parts[0], parts[1] - 1 + delta, 1);
    S.month = monthKey(d);
    render();
  }

  /* ---------- global binds ---------- */
  function bindApp() {
    document.getElementById('btn-cambiar').addEventListener('click', cambiarYo);
    root.querySelectorAll('[data-tab]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        S.tab = btn.getAttribute('data-tab');
        UI.gastoEventoId = null; UI.showCreateEvento = false; UI.showGastoForm = false; UI.gastoForm = null; UI.cuotaEditingTipo = null;
        render();
      });
    });
    const toggleMembers = document.getElementById('btn-toggle-members');
    toggleMembers.addEventListener('click', function () {
      UI.membersOpen = !UI.membersOpen;
      UI.jugadorForm = null;
      UI.bulkForm = false;
      render();
    });
    if (UI.membersOpen) {
      const soyAdmin = esAdminSesion();
      if (soyAdmin) {
        root.querySelectorAll('[data-remove-member]').forEach(function (btn) {
          btn.addEventListener('click', function () { removeMember(btn.getAttribute('data-remove-member')).then(render); });
        });
        root.querySelectorAll('[data-edit-jugador]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            const id = btn.getAttribute('data-edit-jugador');
            const perfil = S.jugadores[id] || {};
            UI.jugadorForm = {
              editing: id,
              nombre: perfil.nombre || '', apellido: perfil.apellido || '',
              numero: perfil.numero || '', mail: perfil.mail || '',
              aliasBanco: perfil.aliasBanco || '', telefono: perfil.telefono || '',
              dni: perfil.dni || '', fechaNacimiento: perfil.fechaNacimiento || ''
            };
            render();
          });
        });
        const newBtn = document.getElementById('btn-new-jugador');
        if (newBtn) newBtn.addEventListener('click', function () {
          UI.jugadorForm = { editing: null, nombre: '', apellido: '', numero: '', mail: '', aliasBanco: '', telefono: '', dni: '', fechaNacimiento: '' };
          render();
        });
        const cancelBtn = document.getElementById('btn-cancel-jugador');
        if (cancelBtn) cancelBtn.addEventListener('click', function () { UI.jugadorForm = null; render(); });
        const saveBtn = document.getElementById('btn-save-jugador');
        if (saveBtn) saveBtn.addEventListener('click', async function () {
          const f = UI.jugadorForm;
          const numero = document.getElementById('jf-numero').value.trim();
          const mail = document.getElementById('jf-mail').value.trim();
          const aliasBanco = document.getElementById('jf-alias').value.trim();
          const telefono = document.getElementById('jf-telefono').value.trim();
          const dni = document.getElementById('jf-dni').value.trim();
          const fechaNacimiento = document.getElementById('jf-fechaNacimiento').value.trim();
          if (f.editing) {
            UI.jugadorForm = null;
            await updateJugador(f.editing, { numero: numero, mail: mail, aliasBanco: aliasBanco, telefono: telefono, dni: dni, fechaNacimiento: fechaNacimiento });
            render();
          } else {
            const nombre = document.getElementById('jf-nombre').value.trim();
            const apellido = document.getElementById('jf-apellido').value.trim();
            if (!nombre) return;
            UI.jugadorForm = null;
            await addJugador({ nombre: nombre, apellido: apellido, numero: numero, mail: mail, aliasBanco: aliasBanco, telefono: telefono, dni: dni, fechaNacimiento: fechaNacimiento });
            render();
          }
        });
        const bulkBtn = document.getElementById('btn-bulk-jugadores');
        if (bulkBtn) bulkBtn.addEventListener('click', function () { UI.bulkForm = true; render(); });
        const cancelBulkBtn = document.getElementById('btn-cancel-bulk');
        if (cancelBulkBtn) cancelBulkBtn.addEventListener('click', function () { UI.bulkForm = false; render(); });
        const saveBulkBtn = document.getElementById('btn-save-bulk');
        if (saveBulkBtn) saveBulkBtn.addEventListener('click', async function () {
          const lines = document.getElementById('bulk-textarea').value.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
          UI.bulkForm = false;
          for (const line of lines) {
            const parts = line.split(' ').filter(Boolean);
            const nombre = parts[0] || '';
            const apellido = parts.slice(1).join(' ');
            await addJugador({ nombre: nombre, apellido: apellido, numero: '', mail: '', aliasBanco: '', telefono: '', dni: '', fechaNacimiento: '' });
          }
          render();
        });
        const changePinBtn = document.getElementById('btn-change-pin');
        if (changePinBtn) changePinBtn.addEventListener('click', function () { UI.changingPin = true; render(); });
        const cancelPinBtn = document.getElementById('btn-cancel-pin');
        if (cancelPinBtn) cancelPinBtn.addEventListener('click', function () { UI.changingPin = false; render(); });
        const savePinBtn = document.getElementById('btn-save-pin');
        if (savePinBtn) savePinBtn.addEventListener('click', function () {
          const pin = document.getElementById('new-pin').value.trim();
          if (pin.length !== 4) return;
          UI.changingPin = false;
          saveAdminPin(pin);
        });
      }
    }
    if (S.tab === 'avisos') bindAvisos();
    else if (S.tab === 'gastos') bindGastos();
    else if (esAdminSesion()) bindCuotas();
    else bindCuotaJugadorPropio();
  }

  loadAll();
})();
</script>
</body>
</html>
